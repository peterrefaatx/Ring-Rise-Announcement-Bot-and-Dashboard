services:
  - type: web
    name: ringrise-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FORCE_SECURE_COOKIES
        value: "true"
      - key: INITIAL_ADMIN_NAME
        value: System Administrator
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_TEAM
        value: "false"
      - key: BRAND_NAME
        value: Daily Dashboard
      - key: BRAND_PRIMARY_COLOR
        value: "#0077B6"
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_CHAT_ID
        value: ""
